  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #2B3870; --navy-dk: #1a2250;
      --green: #4A7A2E; --green-lt: #6aae40;
      --cream: #F5F3EE; --cream-dk: #E8E4DA;
      --text: #1C2035; --muted: #6B7080;
      --white: #FDFCF9;
      --px: clamp(16px,5vw,120px);
      --hero-pt: clamp(90px,10vh,160px);
      /* Zones sûres (encoche / Dynamic Island / barres de nav gestuelles) */
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
    }
    html { scroll-behavior: smooth; font-size: 16px; }
    body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--text); overflow-x: hidden; }
    h1,h2,h3 { font-family: 'Lora', serif; }
    ::selection { background: var(--green); color: #fff; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--cream-dk); }
    ::-webkit-scrollbar-thumb { background: var(--navy); border-radius: 3px; }

    /* Anti-sélection / anti-drag */
    * { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-user-drag: none; }
    input, textarea, [contenteditable] { -webkit-user-select: text; -moz-user-select: text; -ms-user-select: text; user-select: text; }
    img { pointer-events: none; -webkit-user-drag: none; }

    @keyframes floatBlob { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-14px) scale(1.04)} }
    @keyframes modalIn   { from{opacity:0;transform:perspective(900px) translateY(36px) rotateX(7deg) scale(.95)} to{opacity:1;transform:perspective(900px) translateY(0) rotateX(0) scale(1)} }
    @keyframes ripple    { to{transform:scale(4);opacity:0} }
    @keyframes slideIn   { from{opacity:0;transform:translateY(18px) rotateX(3deg)} to{opacity:1;transform:translateY(0) rotateX(0)} }
    @keyframes spin      { to{transform:rotate(360deg)} }

    .reveal {
      opacity: 0; transform: perspective(900px) translateY(60px) rotateX(22deg) scale(0.93);
      transition: opacity .7s cubic-bezier(0.22,1,.36,1), transform .7s cubic-bezier(0.22,1,.36,1);
      transform-origin: 50% 100%; will-change: transform, opacity;
    }
    .reveal.visible { opacity: 1; transform: perspective(900px) translateY(0) rotateX(0) scale(1); }
    .reveal-left {
      opacity: 0; transform: perspective(900px) translateX(-60px) rotateY(18deg);
      transition: opacity .7s cubic-bezier(0.22,1,.36,1), transform .7s cubic-bezier(0.22,1,.36,1);
      transform-origin: 100% 50%; will-change: transform, opacity;
    }
    .reveal-left.visible { opacity: 1; transform: perspective(900px) translateX(0) rotateY(0); }
    .reveal-right {
      opacity: 0; transform: perspective(900px) translateX(60px) rotateY(-18deg);
      transition: opacity .7s cubic-bezier(0.22,1,.36,1), transform .7s cubic-bezier(0.22,1,.36,1);
      transform-origin: 0% 50%; will-change: transform, opacity;
    }
    .reveal-right.visible { opacity: 1; transform: perspective(900px) translateX(0) rotateY(0); }
    .scroll-tilt { will-change: transform; transition: transform .05s linear; }

    .nav-links { display: flex; align-items: center; gap: clamp(14px,2vw,32px); }
    .hamburger { display: none; background: none; border: none; cursor: pointer; padding: 6px; }
    .hamburger span { display: block; width: 22px; height: 2px; background: var(--navy); border-radius: 2px; margin: 5px 0; transition: all .3s; }
    .mobile-menu { display: none; }
    .hero-section { min-height: 100vh; min-height: 100dvh; }

    /* ══════════════════════════════════════════════════════════════
       CADRAGE UNIVERSEL — paliers couvrant tous les smartphones,
       tablettes, PC et téléviseurs (Apple, Samsung, Redmi/Xiaomi,
       Google, etc). Le dimensionnement fluide (clamp/vw) ci-dessus
       s'adapte déjà en continu ; ces paliers affinent la mise en page
       (colonnes, menu, espacements) aux largeurs réelles du marché.
       Tout écran non couvert explicitement hérite automatiquement du
       palier le plus proche — c'est le cadrage automatique de secours.
       ══════════════════════════════════════════════════════════════ */

    /* Écran plié / cover (Galaxy Z Fold fermé, ~280-320px) */
    @media (max-width: 319px) {
      :root { --px: 10px; }
      h1 { font-size: 1.5rem !important; }
    }

    /* Petits téléphones : iPhone SE 1G/5/5s, très anciens Android (320-359px) */
    @media (min-width: 320px) and (max-width: 359px) {
      :root { --px: 14px; }
      h1 { font-size: clamp(1.5rem, 8vw, 1.9rem) !important; }
    }

    /* Téléphones compacts : Galaxy S/A/Redmi entrée de gamme, iPhone mini (360-389px) */
    @media (min-width: 360px) and (max-width: 389px) {
      :root { --px: 16px; }
    }

    /* Téléphones standards : iPhone 12/13/14/15/16, Pixel, Galaxy S21-S24 (390-411px) */
    @media (min-width: 390px) and (max-width: 411px) {
      :root { --px: 18px; }
    }

    /* Grands téléphones : Galaxy Note/S+/Ultra, Pixel XL, Redmi Note (412-479px) */
    @media (min-width: 412px) and (max-width: 479px) {
      :root { --px: 20px; }
    }

    /* Phablettes / Max / Pro Max / Plus : iPhone Pro Max, Galaxy Ultra (480-599px) */
    @media (min-width: 480px) and (max-width: 599px) {
      :root { --px: 24px; }
    }

    /* Pliables dépliés / petites tablettes (600-767px) */
    @media (min-width: 600px) and (max-width: 767px) {
      :root { --px: 32px; }
    }

    /* Tablettes portrait : iPad mini/standard, Galaxy Tab (768-819px) */
    @media (min-width: 768px) and (max-width: 819px) {
      :root { --px: 40px; }
    }

    /* Tablettes portrait grandes : iPad Air/Pro 11" (820-1023px) */
    @media (min-width: 820px) and (max-width: 1023px) {
      :root { --px: 48px; }
    }

    /* Tablettes paysage / iPad Pro 12.9" / petits laptops (1024-1279px) */
    @media (min-width: 1024px) and (max-width: 1279px) {
      :root { --px: 56px; }
    }

    /* Laptops standards (1280-1535px) */
    @media (min-width: 1280px) and (max-width: 1535px) {
      :root { --px: 72px; }
    }

    /* Desktop Full HD / laptops haute résolution (1536-1919px) */
    @media (min-width: 1536px) and (max-width: 1919px) {
      :root { --px: 96px; }
    }

    /* Desktop Full HD large (1920-2559px) */
    @media (min-width: 1920px) and (max-width: 2559px) {
      :root { --px: 120px; }
    }

    /* Moniteurs QHD / 1440p / petites TV (2560-3839px) */
    @media (min-width: 2560px) {
      html { font-size: 20px; }
      :root { --px: 200px; }
    }

    /* TV 4K UHD (3840-7679px) */
    @media (min-width: 3840px) {
      html { font-size: 28px; }
      :root { --px: 320px; }
    }

    /* TV 8K (7680px et plus) */
    @media (min-width: 7680px) {
      html { font-size: 44px; }
      :root { --px: 480px; }
    }

    /* Layout structurel : tablette et en-dessous */
    @media (max-width: 1024px) {
      .why-grid { grid-template-columns: 1fr !important; gap: 40px !important; }
      .why-cards { grid-template-columns: 1fr 1fr; }
    }

    /* Layout structurel : mobile (téléphones jusqu'aux phablettes) */
    @media (max-width: 768px) {
      .nav-links { display: none !important; }
      .hamburger { display: block !important; }
      .mobile-menu.open { display: flex; flex-direction: column; position: fixed; top: calc(70px + var(--safe-t)); left: 0; right: 0; background: rgba(245,243,238,0.98); backdrop-filter: blur(16px); padding: 20px calc(24px + var(--safe-r)) 28px calc(24px + var(--safe-l)); gap: 18px; border-bottom: 1px solid rgba(43,56,112,0.08); z-index: 190; }
      .mobile-menu a, .mobile-menu button { width: 100%; text-align: left; }
      .hero-btns { flex-direction: column !important; align-items: stretch !important; }
      .hero-btns a, .hero-btns button { text-align: center !important; }
      .steps-grid { grid-template-columns: 1fr !important; }
      .why-cards { grid-template-columns: 1fr !important; }
      .modal-inner { padding: 24px 20px !important; border-radius: 16px !important; }
      .composer-inner { padding: 24px 20px !important; }
    }
    @media (max-width: 480px) {
      .stats-row { flex-direction: column !important; align-items: center !important; }
      .step-card { padding: 24px 20px !important; }
    }

    /* Téléphones en mode paysage (hauteur réduite — toutes marques) */
    @media (max-height: 500px) and (orientation: landscape) {
      .modal-inner { max-height: 94vh !important; max-height: 94dvh !important; }
      .hero-section { min-height: auto !important; padding-top: calc(80px + var(--safe-t)) !important; padding-bottom: 32px !important; }
    }

    /* Appareils tactiles : neutraliser les effets de tilt liés au survol
       (évite un tilt qui reste "collé" après un tap sur mobile/tablette) */
    @media (hover: none) {
      .scroll-tilt { transform: none !important; }
      .reveal, .reveal-left, .reveal-right { transition-duration: .5s; }
    }

    /* Respect de la préférence "réduire les animations" (tous appareils) */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
      .reveal, .reveal-left, .reveal-right { opacity: 1 !important; transform: none !important; }
    }

<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const C = {
  navy:'#2B3870', navyDk:'#1a2250',
  green:'#4A7A2E', greenLt:'#6aae40',
  cream:'#F5F3EE', creamDk:'#E8E4DA',
  text:'#1C2035', muted:'#6B7080', white:'#FDFCF9'
};

/* ── Highlight 'IN' in green (MyrtINe, Made IN France, fINancement…) ── */
const GreenIN = ({ text }) => {
  const value = String(text);
  const highlight = (match) => <span style={{color:C.green, fontWeight:700}}>{match}</span>;
  const parts = value.split(/(in)/gi);
  return <>{parts.map((part, index) => part.toLowerCase() === 'in' ? <React.Fragment key={index}>{highlight(part)}</React.Fragment> : <React.Fragment key={index}>{part}</React.Fragment>)}</>;
};

const BlueText = ({ children, style={} }) => <span style={{color:C.navy, ...style}}>{children}</span>;

/* ── Scroll reveal + continuous 3D ─── */
const useReveal = () => {
  useEffect(() => {
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
    }, { threshold: 0.1 });
    document.querySelectorAll('.reveal, .reveal-left, .reveal-right').forEach(el => obs.observe(el));

    let raf;
    const onScroll = () => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        const midY = window.innerHeight / 2;
        document.querySelectorAll('.scroll-tilt').forEach(el => {
          if (el.dataset.hovered) return;
          const rect = el.getBoundingClientRect();
          const elMid = rect.top + rect.height / 2;
          const dist = (elMid - midY) / midY;
          const rotX = dist * 10;
          const scale = 1 - Math.abs(dist) * 0.04;
          if (rect.top < window.innerHeight + 100 && rect.bottom > -100) {
            el.style.transform = `perspective(700px) rotateX(${rotX}deg) scale(${scale})`;
          }
        });
        document.querySelectorAll('[data-parallax]').forEach(el => {
          const speed = parseFloat(el.dataset.parallax) || 0.15;
          const rect = el.parentElement.getBoundingClientRect();
          const offset = (window.innerHeight / 2 - (rect.top + rect.height / 2)) * speed;
          el.style.transform = `translateY(${offset}px)`;
        });
      });
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => { obs.disconnect(); window.removeEventListener('scroll', onScroll); cancelAnimationFrame(raf); };
  }, []);
};

/* ── Animated Button ────────────────── */
const AnimBtn = ({ children, onClick, style={}, variant='green', href, ...rest }) => {
  const ref = useRef();
  const bg = variant === 'green' ? `linear-gradient(135deg, ${C.green}, ${C.greenLt})`
    : variant === 'navy' ? C.navy
    : variant === 'ghost' ? 'rgba(255,255,255,0.55)' : C.navy;
  const shadow = variant === 'green' ? '0 6px 22px rgba(74,122,46,0.32)'
    : variant === 'navy' ? '0 6px 22px rgba(43,56,112,0.22)'
    : '0 2px 10px rgba(43,56,112,0.08)';

  const doRipple = e => {
    const btn = ref.current; if (!btn) return;
    const rect = btn.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    const ripple = document.createElement('span');
    Object.assign(ripple.style, {
      position:'absolute', borderRadius:'50%', pointerEvents:'none',
      width:'8px', height:'8px', left:`${x-4}px`, top:`${y-4}px`,
      background:'rgba(255,255,255,0.45)', animation:'ripple .55s ease-out forwards'
    });
    btn.appendChild(ripple);
    setTimeout(() => ripple.remove(), 560);
  };

  const baseStyle = {
    position:'relative', overflow:'hidden', cursor:'pointer', border:'none',
    borderRadius:'clamp(8px,1vw,12px)', padding:'clamp(11px,1.2vw,16px) clamp(18px,2.5vw,34px)',
    fontSize:'clamp(13px,1.1vw,16px)', fontWeight:700, fontFamily:'Inter,sans-serif',
    background: bg, color: variant==='ghost' ? C.navy : 'white',
    border: variant==='ghost' ? `1.5px solid rgba(43,56,112,0.2)` : 'none',
    backdropFilter: variant==='ghost' ? 'blur(12px)' : 'none',
    boxShadow: shadow,
    transition: 'transform .18s cubic-bezier(0.34,1.56,0.64,1), box-shadow .18s ease',
    display:'inline-block', textDecoration:'none', textAlign:'center',
    ...style
  };

  const hoverOn = e => {
    e.currentTarget.style.transform = 'translateY(-3px) scale(1.03)';
    e.currentTarget.style.boxShadow = variant==='green' ? '0 12px 32px rgba(74,122,46,0.42)'
      : variant==='navy' ? '0 12px 28px rgba(43,56,112,0.32)' : '0 6px 18px rgba(43,56,112,0.14)';
  };
  const hoverOff = e => { e.currentTarget.style.transform=''; e.currentTarget.style.boxShadow=shadow; };

  const props = {
    ref, style:baseStyle,
    onMouseEnter:hoverOn, onMouseLeave:hoverOff,
    onMouseDown:e=>{ e.currentTarget.style.transform='scale(0.96) translateY(1px)'; },
    onMouseUp:hoverOn,
    onClick: e => { doRipple(e); onClick && onClick(e); },
    ...rest
  };

  if (href) return <a href={href} {...props}>{children}</a>;
  return <button {...props}>{children}</button>;
};

/* ── Nav ────────────────────────────── */
const Nav = ({ onCTA }) => {
  const [scrolled, setScrolled] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  useEffect(() => {
    const fn = () => setScrolled(window.scrollY > 40);
    window.addEventListener('scroll', fn);
    return () => window.removeEventListener('scroll', fn);
  }, []);
  return (
    <>
      <nav style={{
        position:'fixed',top:0,left:0,right:0,zIndex:200,
        background: scrolled ? 'rgba(245,243,238,0.96)' : 'transparent',
        backdropFilter: scrolled ? 'blur(18px)' : 'none',
        borderBottom: scrolled ? '1px solid rgba(43,56,112,0.07)' : 'none',
        transition:'all .3s',padding:'calc(var(--safe-t)) calc(var(--px) + var(--safe-r)) 0 calc(var(--px) + var(--safe-l))',height:'calc(clamp(60px,8vh,80px) + var(--safe-t))',
        display:'flex',alignItems:'center',justifyContent:'space-between'
      }}>
        <Logo height={48}/>
        <div className="nav-links">
          <a href="#comment" style={{color:C.navy,fontWeight:500,fontSize:'clamp(13px,1vw,15px)',textDecoration:'none',opacity:.75}}>Comment ça marche</a>
          <a href="#pourquoi" style={{color:C.navy,fontWeight:500,fontSize:'clamp(13px,1vw,15px)',textDecoration:'none',opacity:.75}}>Pourquoi Myrtine</a>
          <AnimBtn variant="navy" onClick={onCTA} style={{padding:'10px 20px',fontSize:'clamp(12px,0.9vw,14px)'}}>
            Diagnostic en moins de 48 heures
          </AnimBtn>
        </div>
        <button className="hamburger" onClick={()=>setMenuOpen(o=>!o)} aria-label="Menu">
          <span style={{transform:menuOpen?'rotate(45deg) translate(5px,5px)':''}}/>
          <span style={{opacity:menuOpen?0:1}}/>
          <span style={{transform:menuOpen?'rotate(-45deg) translate(5px,-5px)':''}}/>
        </button>
      </nav>
      <div className={`mobile-menu ${menuOpen?'open':''}`}>
        <a href="#comment" onClick={()=>setMenuOpen(false)} style={{color:C.navy,fontWeight:500,fontSize:16,textDecoration:'none'}}>Comment ça marche</a>
        <a href="#pourquoi" onClick={()=>setMenuOpen(false)} style={{color:C.navy,fontWeight:500,fontSize:16,textDecoration:'none'}}>Pourquoi Myrtine</a>
        <AnimBtn variant="green" onClick={()=>{setMenuOpen(false);onCTA();}} style={{width:'100%',textAlign:'center',padding:'13px 20px'}}>
          Demandez votre diagnostic →
        </AnimBtn>
      </div>
    </>
  );
};

/* ── Hero ───────────────────────────── */
const Hero = ({ onCTA }) => {
  const sceneRef = useRef();
  useEffect(() => {
    let raf;
    const fn = e => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        if (!sceneRef.current) return;
        const cx = window.innerWidth/2, cy = window.innerHeight/2;
        const dx = (e.clientX-cx)/cx * 5;
        const dy = (e.clientY-cy)/cy * 3;
        sceneRef.current.style.transform = `perspective(1200px) rotateY(${dx}deg) rotateX(${-dy}deg)`;
      });
    };
    window.addEventListener('mousemove', fn, {passive:true});
    return () => { window.removeEventListener('mousemove', fn); cancelAnimationFrame(raf); };
  }, []);

  return (
    <section className="hero-section" style={{
      display:'flex',flexDirection:'column',
      alignItems:'center',justifyContent:'center',
      padding:'var(--hero-pt) var(--px) clamp(60px,8vh,100px)',
      background:'radial-gradient(ellipse at 65% 35%, oklch(0.93 0.04 145) 0%, var(--cream) 50%, oklch(0.91 0.03 258) 100%)',
      textAlign:'center',position:'relative',overflow:'hidden'
    }}>
      {[{w:500,h:500,top:-100,right:-80,bg:'oklch(0.91 0.05 145)',op:0.2,dur:'6s',speed:0.12},
        {w:360,h:360,bottom:-60,left:-50,bg:'oklch(0.88 0.04 260)',op:0.15,dur:'8s',speed:0.22}].map((b,i)=>(
        <div key={i} data-parallax={b.speed} style={{
          position:'absolute',width:b.w,height:b.h,borderRadius:'50%',
          top:b.top,right:b.right,bottom:b.bottom,left:b.left,
          background:b.bg,opacity:b.op,filter:'blur(80px)',
          animation:`floatBlob ${b.dur} ease-in-out infinite`,pointerEvents:'none',willChange:'transform'
        }}/>
      ))}

      <div ref={sceneRef} style={{transition:'transform .12s ease-out',willChange:'transform',position:'relative',zIndex:1,maxWidth:'clamp(320px,85vw,820px)',width:'100%'}}>
        <div style={{
          display:'inline-block',background:'rgba(74,122,46,0.1)',border:'1px solid rgba(74,122,46,0.25)',
          borderRadius:100,padding:'clamp(4px,0.5vh,7px) clamp(12px,2vw,20px)',marginBottom:'clamp(16px,3vh,28px)',
          fontSize:'clamp(11px,1vw,13px)',fontWeight:600,color:C.green,letterSpacing:'0.06em',textTransform:'uppercase'
        }}>🇫🇷 <BlueText><GreenIN text="Made in France"/> — <GreenIN text="financements publics"/></BlueText></div>

        <h1 style={{
          fontSize:'clamp(1.9rem,5.5vw,4.2rem)',fontWeight:700,color:C.navy,
          lineHeight:1.12,marginBottom:'clamp(14px,2.5vh,24px)',textWrap:'pretty'
        }}>
          Votre entreprise mérite<br/>
          <span style={{background:`linear-gradient(135deg,${C.green},${C.greenLt})`,WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>
            les aides auxquelles elle a droit.
          </span>
        </h1>
        <p style={{fontSize:'clamp(.9rem,1.4vw,1.15rem)',color:C.muted,maxWidth:580,margin:'0 auto clamp(24px,4vh,38px)',lineHeight:1.75,textWrap:'pretty'}}>
          Myrtine identifie et vous connecte aux <BlueText><GreenIN text="financements"/></BlueText> publics français et européens adaptés à votre projet <strong style={{color:C.navy}}><GreenIN text="Made in France"/></strong>. Répondez à quelques
          questions et recevez votre <strong style={{color:C.navy}}>retour par mail</strong> en moins de 48 heures.
        </p>

        <div className="hero-btns" style={{display:'flex',gap:14,justifyContent:'center',flexWrap:'wrap'}}>
          <AnimBtn variant="green" onClick={onCTA}>Demandez votre DIAGNOSTIC FLASH d'éligibilité aux aides publiques →</AnimBtn>
        </div>
        <div className="hero-btns" style={{display:'flex',gap:14,justifyContent:'center',flexWrap:'wrap',marginTop:12}}>
          <AnimBtn variant="ghost" href="#comment">Découvrir la démarche</AnimBtn>
        </div>

        <div className="stats-row" style={{marginTop:'clamp(36px,5vh,60px)',display:'flex',gap:'clamp(14px,3vw,48px)',justifyContent:'center',flexWrap:'wrap'}}>
          {[{v:'Gratuit',l:'diagnostic'},{v:'< 48h',l:'retour par mail'}].map(({v,l})=>(
            <div key={v} style={{
              background:'rgba(255,255,255,0.55)',backdropFilter:'blur(10px)',
              borderRadius:'clamp(10px,1.2vw,14px)',padding:'clamp(12px,1.5vw,18px) clamp(16px,2vw,26px)',
              textAlign:'center',border:'1px solid rgba(43,56,112,0.1)',
              boxShadow:'0 4px 16px rgba(43,56,112,0.07)',
              transition:'transform .2s cubic-bezier(0.34,1.56,0.64,1)',cursor:'default'
            }}
              onMouseEnter={e=>e.currentTarget.style.transform='translateY(-4px) perspective(400px) rotateX(4deg)'}
              onMouseLeave={e=>e.currentTarget.style.transform=''}>
              <div style={{fontSize:'clamp(1.3rem,2.5vw,1.9rem)',fontWeight:700,color:C.navy,fontFamily:'Lora,serif'}}>{v}</div>
              <div style={{fontSize:'clamp(10px,0.85vw,12px)',color:C.muted,marginTop:3}}>{l}</div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
};

/* ── How it works ───────────────────── */
const HowItWorks = ({ onCTA }) => {

const SelectOther = ({ field, val, onChange }) => {
  const isCustom = val && !field.options.includes(val);
  const [showCustom, setShowCustom] = useState(isCustom);
  const [custom, setCustom] = useState(isCustom ? val : '');
  const pick = opt => {
    if (opt==='Autre') { setShowCustom(true); onChange(''); }
    else { setShowCustom(false); setCustom(''); onChange(opt); }
  };
  const upd = v => { setCustom(v); onChange(v); };
  return (
    <div style={{display:'flex',flexDirection:'column',gap:'clamp(5px,0.6vh,8px)'}}>
      {field.options.map(opt=>(
        <button key={opt} onClick={()=>pick(opt)} type="button" style={{
          textAlign:'left',padding:'clamp(8px,1vh,11px) clamp(11px,1.2vw,15px)',
          borderRadius:'clamp(7px,0.8vw,10px)',cursor:'pointer',
          border:`1.5px solid ${(val===opt||(opt==='Autre'&&showCustom))?C.green:'rgba(43,56,112,0.11)'}`,
          background:(val===opt||(opt==='Autre'&&showCustom))?'rgba(74,122,46,0.07)':'transparent',
          fontSize:'clamp(12px,1vw,14px)',color:C.text,fontFamily:'Inter,sans-serif',
          transition:'all .15s',display:'flex',alignItems:'center',gap:8
        }}>
          <span style={{color:(val===opt||(opt==='Autre'&&showCustom))?C.green:'transparent',fontSize:11}}>✓</span>{opt}
        </button>
      ))}
      {showCustom && <input value={custom} onChange={e=>upd(e.target.value)} placeholder="Précisez…" autoFocus style={{...iStyle,marginTop:4,borderColor:C.green}}/>}
    </div>
  );
};

const CheckboxesOther = ({ field, val=[], onChange }) => {
  const stdOpts = field.options.filter(o=>o!=='Autre');
  const hasCustom = val.some(v=>!field.options.includes(v));
  const customText = hasCustom ? val.find(v=>!field.options.includes(v)) : '';
  const [showOther, setShowOther] = useState(hasCustom||val.includes('Autre'));
  const [otherVal, setOtherVal] = useState(customText||'');

  const stdVals = val.filter(v=>stdOpts.includes(v));
  const toggle = opt => {
    if (opt==='Autre') {
      const next = !showOther; setShowOther(next);
      if (!next) { onChange(stdVals); setOtherVal(''); }
    } else {
      const next = stdVals.includes(opt) ? stdVals.filter(v=>v!==opt) : [...stdVals,opt];
      onChange(showOther && otherVal ? [...next,otherVal] : next);
    }
  };
  const updOther = v => { setOtherVal(v); onChange(v ? [...stdVals,v] : stdVals); };
  return (
    <div style={{display:'flex',flexDirection:'column',gap:'clamp(5px,0.6vh,8px)'}}>
      {field.options.map(opt=>{
        const checked = opt==='Autre' ? showOther : stdVals.includes(opt);
        return (
          <button key={opt} onClick={()=>toggle(opt)} type="button" style={{
            textAlign:'left',padding:'clamp(8px,1vh,11px) clamp(11px,1.2vw,15px)',
            borderRadius:'clamp(7px,0.8vw,10px)',cursor:'pointer',
            border:`1.5px solid ${checked?C.green:'rgba(43,56,112,0.11)'}`,
            background:checked?'rgba(74,122,46,0.07)':'transparent',
            fontSize:'clamp(12px,1vw,14px)',color:C.text,fontFamily:'Inter,sans-serif',
            transition:'all .15s',display:'flex',alignItems:'center',gap:10
          }}>
            <div style={{width:16,height:16,borderRadius:4,flexShrink:0,border:`2px solid ${checked?C.green:'#CBD0E0'}`,background:checked?C.green:'transparent',display:'flex',alignItems:'center',justifyContent:'center'}}>
              {checked&&<svg width="8" height="6" viewBox="0 0 10 8" fill="none"><path d="M1 4L3.5 6.5L9 1" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
            </div>
            {opt}
          </button>
        );
      })}
      {showOther&&<input value={otherVal} onChange={e=>updOther(e.target.value)} placeholder="Précisez…" autoFocus style={{...iStyle,marginTop:4,borderColor:C.green}}/>}
    </div>
  );
};

const StepForm = ({ step, answers, setAnswers, onNext, onPrev, isLast }) => {
  const q = QUESTIONS[step];
  const [errors, setErrors] = useState({});
  const get = id => answers[id] ?? (q.fields.find(f=>f.id===id)?.type==='checkboxes'?[]:'');
  const set = (id,v) => { setAnswers(a=>({...a,[id]:v})); setErrors(e=>({...e,[id]:''})); };

  const isValidEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(e).trim());
  const isValidPhone = p => /^[\d\s()+.-]{8,20}$/.test(String(p).trim());

  const validate = () => {
    const errs = {};
    q.fields.forEach(f=>{
      const v = get(f.id);
      if (f.required) {
        if (f.type==='checkboxes' && (!v || v.length===0)) errs[f.id] = 'Sélectionnez au moins une option.';
        else if (!v || String(v).trim()==='') errs[f.id] = 'Ce champ est requis.';
      }
      if (f.type==='email' && v && !isValidEmail(v)) errs[f.id] = 'Adresse email invalide.';
      if (f.type==='tel' && v && !isValidPhone(v)) errs[f.id] = 'Numéro de téléphone invalide.';
    });
    setErrors(errs);
    return Object.keys(errs).length===0;
  };

  return (
    <div style={{animation:'slideIn .3s ease'}}>
      <h3 style={{fontSize:'clamp(15px,1.5vw,19px)',color:C.navy,marginBottom:'clamp(16px,2vh,24px)',fontFamily:'Lora,serif',display:'flex',alignItems:'center',gap:10}}>

        {q.label}
      </h3>
      <div style={{display:'flex',flexDirection:'column',gap:'clamp(14px,1.8vh,22px)'}}>
        {q.fields.map(f=>(
          <div key={f.id}>
            <label style={{display:'block',fontSize:'clamp(11px,0.9vw,13px)',fontWeight:600,color:C.navy,marginBottom:7}}>
              {f.label}{f.required&&<span style={{color:C.green,marginLeft:3}}>*</span>}
            </label>
            {f.type==='text'&&<input value={get(f.id)} onChange={e=>set(f.id,e.target.value)} placeholder={f.placeholder} style={{...iStyle,borderColor:errors[f.id]?'#e05252':undefined}}/>}
            {f.type==='email'&&<input type="email" value={get(f.id)} onChange={e=>set(f.id,e.target.value)} placeholder={f.placeholder} style={{...iStyle,borderColor:errors[f.id]?'#e05252':undefined}}/>}
            {f.type==='tel'&&<input type="tel" value={get(f.id)} onChange={e=>set(f.id,e.target.value)} placeholder={f.placeholder} style={{...iStyle,borderColor:errors[f.id]?'#e05252':undefined}}/>}
            {f.type==='number'&&<input type="number" value={get(f.id)} onChange={e=>set(f.id,e.target.value)} placeholder={f.placeholder} min={f.min||0} style={{...iStyle,borderColor:errors[f.id]?'#e05252':undefined,maxWidth:180}}/>}
            {f.type==='textarea'&&<textarea value={get(f.id)} onChange={e=>set(f.id,e.target.value)} placeholder={f.placeholder} rows={4} style={{...iStyle,resize:'vertical'}}/>}
            {f.type==='select'&&<SelectOther field={f} val={get(f.id)} onChange={v=>set(f.id,v)}/>}
            {f.type==='checkboxes'&&<CheckboxesOther field={f} val={get(f.id)} onChange={v=>set(f.id,v)}/>}
            {errors[f.id]&&<p style={{color:'#e05252',fontSize:12,marginTop:5}}>{errors[f.id]}</p>}

/* ── Submission screen ──────────────── */
const SubmitScreen = ({ answers, onClose }) => {
  const [status, setStatus] = useState('sending'); // sending | recu | error
  const [errorMsg, setErrorMsg] = useState('');

  const sendRequest = () => {
    setStatus('sending');
    setErrorMsg('');
    const A = answers;
    const payload = {
      objet_projet: A.objet_projet || '',
      porteur_projet: A.porteur_projet || '',
      secteur: A.secteur || '',
      localisation: A.localisation || '',
      effectif: A.effectif || '',
      chiffre_affaires: A.ca || '',
      budget_previsionnel: A.budget_montant || '',
      calendrier: A.calendrier || '',
      depenses_concernees: Array.isArray(A.depenses_types) ? A.depenses_types : [],
      nom: A.nom || '',
      prenom: A.prenom || '',
      email: A.email || '',
      telephone: A.telephone || '',
    };

    const controller = new AbortController();
    const tid = setTimeout(() => controller.abort(), 180000); // 3 min max

    fetch('https://serveur.myrtine.fr/diagnostic-flash', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
      body: JSON.stringify(payload),
      signal: controller.signal
    })
      .then(async reponse => {
        clearTimeout(tid);
        const contentType = reponse.headers.get('content-type') || '';
        if (!contentType.includes('application/json')) {
          setStatus('error');
          setErrorMsg('serveur indisponible');
          return;
        }
        const data = await reponse.json();
        if (!reponse.ok) {
          setStatus('error');
          setErrorMsg(data?.message || data?.etat_de_la_requete || 'serveur indisponible');
          return;
        }
        const etat = String(data?.etat_de_la_requete).toLowerCase();
        if (etat === 'recue') {
          setStatus('recu');
        } else if (etat === 'demande_illicite') {
          setStatus('illicite');
        } else if (etat === 'demande_improbable') {
          setStatus('improbable');
        } else if (etat === 'informations_manquantes') {
          setStatus('incomplet');
        } else {
          setStatus('error');
          setErrorMsg('');
        }
      })
      .catch(err => {
        clearTimeout(tid);
        const isAbort = err?.name === 'AbortError';
        const isNetwork = err?.name === 'TypeError' || err?.message === 'Failed to fetch';
        setStatus('error');
        setErrorMsg((isAbort || isNetwork) ? 'serveur indisponible' : '');
      });
  };

  useEffect(() => { sendRequest(); }, []); // eslint-disable-line

  if (status==='sending') return (
    <div className="composer-inner" style={{padding:'clamp(32px,5vh,52px) clamp(20px,4vw,44px)',textAlign:'center'}}>
      <div style={{width:40,height:40,border:`3px solid ${C.creamDk}`,borderTop:`3px solid ${C.green}`,borderRadius:'50%',margin:'0 auto 20px',animation:'spin 1s linear infinite'}}/>
      <h3 style={{color:C.navy,fontSize:'clamp(16px,1.5vw,20px)'}}>Envoi en cours…</h3>
    </div>
  );

  if (status==='recu') return (
    <div className="composer-inner" style={{padding:'clamp(32px,5vh,52px) clamp(20px,4vw,44px)',textAlign:'center'}}>
      <div style={{fontSize:56,marginBottom:16}}>✅</div>
      <h2 style={{fontSize:'clamp(17px,1.8vw,22px)',color:C.navy,marginBottom:12,fontFamily:'Lora,serif'}}>Votre demande a été reçue !</h2>
      <p style={{color:C.muted,fontSize:'clamp(13px,1vw,15px)',lineHeight:1.75,maxWidth:420,margin:'0 auto 24px'}}>
        Votre demande a bien été traitée. Nous vous recontacterons par mail sous <strong>48 heures</strong>.
      </p>
      <AnimBtn variant="navy" onClick={onClose}>Fermer</AnimBtn>
    </div>
  );

  if (status==='illicite') return (
    <div className="composer-inner" style={{padding:'clamp(32px,5vh,52px) clamp(20px,4vw,44px)',textAlign:'center'}}>
      <div style={{fontSize:52,marginBottom:16}}>🚫</div>
      <h2 style={{fontSize:'clamp(16px,1.6vw,20px)',color:C.navy,marginBottom:12,fontFamily:'Lora,serif'}}>Demande non traitée</h2>
      <p style={{color:C.muted,fontSize:'clamp(13px,1vw,15px)',lineHeight:1.75,maxWidth:420,margin:'0 auto 24px'}}>
        Votre demande a bien été reçue, mais elle ne sera pas traitée car elle a été jugée illicite.
      </p>
      <AnimBtn variant="navy" onClick={onClose}>Fermer</AnimBtn>
    </div>
  );

  if (status==='improbable') return (
    <div className="composer-inner" style={{padding:'clamp(32px,5vh,52px) clamp(20px,4vw,44px)',textAlign:'center'}}>
      <div style={{fontSize:52,marginBottom:16}}>🤔</div>
      <h2 style={{fontSize:'clamp(16px,1.6vw,20px)',color:C.navy,marginBottom:12,fontFamily:'Lora,serif'}}>Demande improbable</h2>
      <p style={{color:C.muted,fontSize:'clamp(13px,1vw,15px)',lineHeight:1.75,maxWidth:420,margin:'0 auto 16px'}}>
        Votre demande a été jugée improbable. Si vous pensez qu'il s'agit d'une erreur, contactez-nous :
      </p>
      <a href="mailto:contact@myrtine.fr?subject=Demande%20improbable" style={{color:C.green,fontWeight:600,fontSize:'clamp(13px,1vw,15px)',display:'block',marginBottom:24}}>contact@myrtine.fr</a>
      <AnimBtn variant="navy" onClick={onClose}>Fermer</AnimBtn>
    </div>
  );

  if (status==='incomplet') return (
    <div className="composer-inner" style={{padding:'clamp(32px,5vh,52px) clamp(20px,4vw,44px)',textAlign:'center'}}>
      <div style={{fontSize:52,marginBottom:16}}>📋</div>
      <h2 style={{fontSize:'clamp(16px,1.6vw,20px)',color:C.navy,marginBottom:12,fontFamily:'Lora,serif'}}>Informations manquantes</h2>
      <p style={{color:C.muted,fontSize:'clamp(13px,1vw,15px)',lineHeight:1.75,maxWidth:420,margin:'0 auto 24px'}}>
        Des informations sont manquantes ou mal remplies dans votre demande. Merci de vérifier et de réessayer.
      </p>
      <AnimBtn variant="navy" onClick={onClose}>Fermer</AnimBtn>
    </div>
  );

  return (
    <div className="composer-inner" style={{padding:'clamp(32px,5vh,52px) clamp(20px,4vw,44px)',textAlign:'center'}}>
      <div style={{fontSize:52,marginBottom:16}}>⚠️</div>
      <h2 style={{fontSize:'clamp(16px,1.6vw,20px)',color:C.navy,marginBottom:12,fontFamily:'Lora,serif'}}>
        {errorMsg==='serveur indisponible' ? 'Le serveur est indisponible' : 'Une erreur est survenue'}
      </h2>
      <p style={{color:C.muted,fontSize:'clamp(12px,0.95vw,14px)',lineHeight:1.75,maxWidth:420,margin:'0 auto 16px'}}>
        Veuillez réessayer plus tard. Si cela se reproduit, veuillez contacter <strong>contact@myrtine.fr</strong> en mettant en objet <strong>"Erreur diagnostic"</strong>.
      </p>
      <a href={`mailto:contact@myrtine.fr?subject=${encodeURIComponent('Erreur diagnostic')}`} style={{color:C.green,fontWeight:600,fontSize:'clamp(13px,1vw,15px)',display:'block',marginBottom:24}}>contact@myrtine.fr</a>
      <div style={{display:'flex',gap:12,justifyContent:'center',flexWrap:'wrap'}}>
        <AnimBtn variant="green" onClick={sendRequest}>Réessayer</AnimBtn>
        <AnimBtn variant="ghost" onClick={onClose} style={{color:C.navy}}>Fermer</AnimBtn>
      </div>
    </div>
  );
};

/* ── Modal ──────────────────────────── */
const Modal = ({ onClose, answers, setAnswers }) => {
  const [step, setStep] = useState(0);
  const [submitted, setSubmitted] = useState(false);
  const [showAbandonConfirm, setShowAbandonConfirm] = useState(false);
  const total = QUESTIONS.length;
  const progress = ((step+1)/total)*100;

  useEffect(()=>{ document.body.style.overflow='hidden'; return()=>{ document.body.style.overflow=''; }; },[]);

  return (
    <div style={{
      position:'fixed',inset:0,zIndex:300,
      background:'rgba(14,18,42,0.7)',backdropFilter:'blur(5px)',
      display:'flex',alignItems:'center',justifyContent:'center',padding:'clamp(10px,2vw,24px)'
    }}>
      <div className="modal-inner" style={{
        background:C.white,borderRadius:'clamp(14px,2vw,22px)',
        width:'100%',maxWidth:'clamp(300px,90vw,580px)',
        maxHeight:'clamp(500px,92vh,800px)',overflow:'auto',
        boxShadow:'0 40px 100px rgba(14,18,42,0.38), 0 0 0 1px rgba(43,56,112,0.07)',
        position:'relative',animation:'modalIn .4s cubic-bezier(0.34,1.4,0.64,1)',
        transformOrigin:'50% 60%'
      }}>
        <button onClick={()=>setShowAbandonConfirm(true)} style={{
          position:'absolute',top:16,right:16,background:'#e05252',border:'none',
          borderRadius:'50%',width:34,height:34,cursor:'pointer',color:'white',
          display:'flex',alignItems:'center',justifyContent:'center',zIndex:10,
          transition:'transform .25s cubic-bezier(0.34,1.56,0.64,1)'
        }}
          onMouseEnter={e=>{ e.currentTarget.style.transform='rotate(90deg)'; }}
          onMouseLeave={e=>{ e.currentTarget.style.transform='rotate(0deg)'; }}
        >
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M3 3L13 13M13 3L3 13" stroke="white" strokeWidth="2" strokeLinecap="round"/>
          </svg>
        </button>

        {showAbandonConfirm && (
          <div style={{
            position:'absolute',inset:0,zIndex:20,borderRadius:'clamp(14px,2vw,22px)',
            background:'rgba(14,18,42,0.55)',backdropFilter:'blur(3px)',
            display:'flex',alignItems:'center',justifyContent:'center',padding:24
          }}>
            <div style={{
              background:C.white,borderRadius:16,padding:'clamp(24px,4vw,32px)',
              maxWidth:360,width:'100%',textAlign:'center',
              boxShadow:'0 24px 60px rgba(14,18,42,0.35)',
              animation:'modalIn .3s cubic-bezier(0.34,1.4,0.64,1)'
            }}>
              <div style={{fontSize:38,marginBottom:14}}>⚠️</div>
              <h3 style={{fontSize:'clamp(15px,1.4vw,18px)',color:C.navy,fontFamily:'Lora,serif',marginBottom:10}}>
                Abandonner le diagnostic ?
              </h3>
              <p style={{fontSize:'clamp(12px,0.95vw,14px)',color:C.muted,lineHeight:1.65,marginBottom:22}}>
                Voulez-vous vraiment abandonner ? Toutes les informations que vous avez remplies dans le formulaire seront perdues.
              </p>
              <div style={{display:'flex',gap:10,justifyContent:'center'}}>
                <button onClick={onClose} style={{
                  background:'#e05252',color:'white',border:'none',borderRadius:9,
                  padding:'11px 26px',fontSize:'clamp(13px,1vw,15px)',fontWeight:700,
                  cursor:'pointer',fontFamily:'Inter,sans-serif',transition:'background .15s'
                }}
                  onMouseOver={e=>e.currentTarget.style.background='#c23e3e'}
                  onMouseOut={e=>e.currentTarget.style.background='#e05252'}>
                  Oui, abandonner
                </button>
                <button onClick={()=>setShowAbandonConfirm(false)} style={{
                  background:'rgba(43,56,112,0.08)',color:C.navy,border:'none',borderRadius:9,
                  padding:'11px 26px',fontSize:'clamp(13px,1vw,15px)',fontWeight:600,
                  cursor:'pointer',fontFamily:'Inter,sans-serif',transition:'background .15s'
                }}
                  onMouseOver={e=>e.currentTarget.style.background='rgba(43,56,112,0.15)'}
                  onMouseOut={e=>e.currentTarget.style.background='rgba(43,56,112,0.08)'}>
                  Non, continuer
                </button>
              </div>
            </div>
          </div>
        )}

        {!submitted ? (
          <div style={{padding:'clamp(24px,4vh,38px) clamp(20px,4vw,40px)'}}>
            <div style={{marginBottom:'clamp(18px,2.5vh,28px)'}}>
              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:6}}>
                <Logo height={28}/>
              </div>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
                <span style={{fontSize:'clamp(11px,0.9vw,13px)',color:C.muted,fontWeight:500}}>Diagnostic en moins de 48 heures — Étape {step+1} / {total}</span>
              </div>
              <div style={{height:3,background:C.creamDk,borderRadius:3,overflow:'hidden'}}>
                <div style={{height:'100%',background:`linear-gradient(90deg,${C.green},${C.greenLt})`,width:`${progress}%`,borderRadius:3,transition:'width .4s ease'}}/>
              </div>
            </div>
            <StepForm step={step} answers={answers} setAnswers={setAnswers}
              onNext={()=>step<total-1?setStep(s=>s+1):setSubmitted(true)}
              onPrev={()=>setStep(s=>Math.max(0,s-1))}
              isLast={step===total-1}/>
          </div>
        ) : (
          <SubmitScreen answers={answers} onClose={onClose}/>
        )}
      </div>
    </div>
  );
};

/* ── App ────────────────────────────── */
const App = () => {
  const [showModal, setShowModal] = useState(false);
  const [answers, setAnswers] = useState(()=>{
    try{return JSON.parse(localStorage.getItem('myrtine_ans')||'{}');}catch{return{};}
  });
  useEffect(()=>{
    try {
      const data = JSON.stringify(answers);
      if (data.length < 50000) localStorage.setItem('myrtine_ans', data);
    } catch{}
  },[answers]);

  useEffect(()=>{
    const noCtxMenu = e => e.preventDefault();
    const noDrag = e => e.preventDefault();
    const noCopy = e => { if(e.ctrlKey && ['a','c','u','s'].includes(e.key.toLowerCase())) e.preventDefault(); };
    document.addEventListener('contextmenu', noCtxMenu);
    document.addEventListener('dragstart', noDrag);
    document.addEventListener('keydown', noCopy);
    return ()=>{
      document.removeEventListener('contextmenu', noCtxMenu);
      document.removeEventListener('dragstart', noDrag);
      document.removeEventListener('keydown', noCopy);
    };
  }, []);

  return (
    <>
      <Nav onCTA={()=>setShowModal(true)}/>
      <Hero onCTA={()=>setShowModal(true)}/>
      <HowItWorks onCTA={()=>setShowModal(true)}/>
      <WhyMyrtine/>
      <CTABanner onCTA={()=>setShowModal(true)}/>
      <Footer/>
      {showModal&&<Modal onClose={()=>setShowModal(false)} answers={answers} setAnswers={setAnswers}/>}
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
